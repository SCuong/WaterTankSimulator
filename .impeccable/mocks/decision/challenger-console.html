<!doctype html><html lang="vi"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#16181b;color:#e6e8ea;font:14px/1.45 Barlow,sans-serif}
.mono{font-family:"JetBrains Mono",monospace}header{height:44px;border-bottom:1px solid #2b2f35;display:flex;align-items:center;gap:20px;padding:0 14px}header b.on{color:#7cc4ff}
main{display:grid;grid-template-columns:280px 1fr 360px;grid-template-rows:1fr 220px;height:856px}
.p{border-right:1px solid #2b2f35;border-bottom:1px solid #2b2f35;padding:12px}.h{font:600 11px Barlow;letter-spacing:.14em;text-transform:uppercase;color:#8a9097;margin-bottom:10px}
.stage{position:relative;background:#1d2024}.m{position:absolute;border:1px solid #8a9097}.w{position:absolute;background:rgba(124,196,255,.4)}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #22262b}.danger{margin-top:40px;border:1px solid #e06c75;color:#e06c75;padding:8px;text-align:center}
.log div{font:12px "JetBrains Mono";color:#8a9097;padding:3px 0}.log b{color:#e5c07b}
.phone{width:300px;height:620px;margin:20px auto;border-radius:42px;background:#000;padding:10px}.scr{height:100%;border-radius:32px;background:#f2f5f7;color:#111;padding:16px;font-family:system-ui;display:grid;gap:10px;align-content:start}.card{background:#fff;border-radius:16px;padding:12px}
</style></head><body>
<header><b>Bể chứa Arduino</b><b class="on">Vận hành</b><span>Tháo rời</span><span>Chế tạo</span></header>
<main>
<div class="p" style="grid-row:1/3"><div class="h">Bàn thí nghiệm</div><div class="row"><span>Tốc độ</span><span class="mono">1×</span></div><div class="row"><span>Van xả</span><span class="mono">35 %</span></div><div class="row"><span>Hộp nguồn</span><span class="mono">2,49 L</span></div><div class="h" style="margin-top:20px">Sự cố</div><div class="row"><span>Rò rỉ</span><span>off</span></div><div class="row"><span>Bơm yếu</span><span>off</span></div><div class="row"><span>Mất Wi-Fi</span><span>off</span></div><div class="danger">Mất điện</div></div>
<div class="stage p"><div class="m" style="left:120px;top:440px;width:560px;height:20px"></div><div class="m" style="left:160px;top:300px;width:160px;height:140px"></div><div class="w" style="left:161px;top:360px;width:158px;height:79px"></div><div class="m" style="left:400px;top:120px;width:100px;height:320px"></div><div class="w" style="left:401px;top:300px;width:98px;height:139px"></div><div class="mono" style="position:absolute;right:16px;top:12px;font-size:28px;color:#7cc4ff">40%</div></div>
<div class="p" style="grid-row:1/3;border-right:0"><div class="phone"><div class="scr"><b style="font-size:18px">Bể chứa tầng thượng</b><div class="card"><b style="font-size:40px">40%</b></div><div class="card">Đang bơm</div></div></div></div>
<div class="p log"><div class="h">Nhật ký</div><div>08:12:31 <b>relay</b> đóng</div><div>08:11:02 mức 30 % → bật bơm</div><div>08:09:40 van xả 35 %</div></div>
</main></body></html>
